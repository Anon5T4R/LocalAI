[package]
name = "localai-studio"
version = "0.7.0"
description = "Runner de GGUF otimizado para CPU/iGPU (llama.cpp)"
authors = ["joaof"]
edition = "2021"

[lib]
name = "localai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
ureq = { version = "2", features = ["json"] }
rfd = "0.15"

# raw-cpuid e instrucao CPUID (x86 only); em ARM/Apple Silicon nao se aplica.
[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
raw-cpuid = "11"

[profile.dev]
incremental = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(target_os = "linux")'.dependencies]
# CSD limpa: contorna a titlebar quebrada do tao <= 0.35 no GNOME/Wayland
# (ver lib.rs). Mesma versao que o tauri ja puxa. Sai junto com o upgrade ao tao 0.36.
gtk = "0.18"
