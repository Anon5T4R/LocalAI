[package]
name = "localai-studio"
version = "0.11.2"
description = "Runner de GGUF otimizado para CPU/iGPU (llama.cpp)"
authors = ["joaof"]
edition = "2021"

[lib]
name = "localai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
ureq = { version = "2", features = ["json"] }
rfd = "0.15"
# RAG local: extracao de texto de PDF (pura Rust, zero binario extra) +
# indice BM25 em SQLite FTS5 (mesma versao/feature do LocalFeed/LocalAgenda).
pdf-extract = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
# Ferramentas: markdown do modelo -> .docx de verdade (puro Rust) e parsing
# do markdown. Zero binario extra no instalador.
docx-rs = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
# Anexo de documentos: ler o texto de .docx (zip + WordprocessingML).
# Mesma versao que o docx-rs ja puxa (sem duplicacao no lock).
zip = { version = "8.6", default-features = false, features = ["deflate"] }

# raw-cpuid e instrucao CPUID (x86 only); em ARM/Apple Silicon nao se aplica.
[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
raw-cpuid = "11"

# OCR de PDFs escaneados no Windows: API nativa Windows.Media.Ocr (zero
# download/binário extra) + leitura das imagens embutidas na página (lopdf).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    "Foundation",
] }
lopdf = "0.42"

[profile.dev]
incremental = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(target_os = "linux")'.dependencies]
# CSD limpa: contorna a titlebar quebrada do tao <= 0.35 no GNOME/Wayland
# (ver lib.rs). Mesma versao que o tauri ja puxa. Sai junto com o upgrade ao tao 0.36.
gtk = "0.18"
